<html>
<head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Settings - T&amp;C Flagger</title>
      <link rel="stylesheet" href="style.css">
</head>
<body>
      <a href="hello.html" class="back-link"><span class="button-back" aria-hidden="true">&#8592;</span><span class="visually-hidden">Back</span></a>
      <div class="menu settings-menu">
            <h1 class="title">Setting</h1>
            <form id="settings-form" class="settings-panel">
                  <label for="threshold">Flag confidence threshold <output id="threshold-value">0.50</output></label>
                  <input id="threshold" name="threshold" type="range" min="0.2" max="0.9" step="0.05" value="0.5">
                  <p class="setting-hint">Lower values flag more clauses; higher values reduce false positives.</p>

                  <label class="setting-toggle" for="qwen-analysis">
                        <input id="qwen-analysis" name="qwenAnalysis" type="checkbox" checked>
                        Add Qwen explanations
                  </label>
                  <p class="setting-hint">Qwen adds plain-language explanations to Legal-BERT findings.</p>

                  <label class="setting-toggle" for="save-history">
                        <input id="save-history" name="saveHistory" type="checkbox" checked>
                        Save scan history on this device
                  </label>
                  <button class="button-menu" type="submit">Save Settings</button>
                  <p id="settings-status" class="status-message" role="status"></p>
            </form>
      </div>
      <script src="storage.js"></script>
      <script src="settings.js"></script>
</body>
</html>
